name: Check and version actions

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test actions
        id: tests
        run: npm test

      - name: Rebuild bundled actions
        id: build
        run: npm run build

      - name: Verify committed bundles
        id: bundles
        run: git diff --exit-code -- setup-valdor/dist/index.js

      - name: Update tests badge
        id: tests_badge
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        continue-on-error: true
        uses: ./badge
        with:
          token: ${{ secrets.BADGES_TOKEN }}
          path: actions-public/tests.svg
          type: tests
          passed: ${{ steps.tests.outcome == 'success' }}
          message: ${{ steps.tests.outcome }}

      - name: Update build badge
        id: build_badge
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}
        continue-on-error: true
        uses: ./badge
        with:
          token: ${{ secrets.BADGES_TOKEN }}
          path: actions-public/build.svg
          type: custom
          label: build
          passed: ${{ steps.build.outcome == 'success' && steps.bundles.outcome == 'success' }}
          message: ${{ steps.build.outcome == 'success' && steps.bundles.outcome || steps.build.outcome }}

      - name: Warn about badge update failures
        if: ${{ !cancelled() && (steps.tests_badge.outcome == 'failure' || steps.build_badge.outcome == 'failure') }}
        run: echo '::warning::Could not update tests/build badges; check the badge service and BADGES_TOKEN.'

  publish:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-actions
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare version
        id: version
        uses: ./version
        env:
          FORGEJO_TOKEN: ${{ github.token }}
        with:
          version-type: TXT
          version-source: version.txt
          prefix: v
          push-tag: false

      - name: Update major version tag
        id: release
        env:
          MAJOR_TAG: v${{ steps.version.outputs.version_major }}
        run: |
          git tag --force "$MAJOR_TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$MAJOR_TAG"

      - name: Update release badge
        id: release_badge
        if: ${{ !cancelled() && (steps.release.outcome == 'success' || steps.release.outcome == 'failure') }}
        continue-on-error: true
        uses: ./badge
        with:
          token: ${{ secrets.BADGES_TOKEN }}
          path: actions-public/release.svg
          type: release
          passed: ${{ steps.release.outcome == 'success' }}
          message: v${{ steps.version.outputs.version_major }}

      - name: Warn about badge update failure
        if: ${{ !cancelled() && steps.release_badge.outcome == 'failure' }}
        run: echo '::warning::Could not update the release badge; check the badge service and BADGES_TOKEN.'
