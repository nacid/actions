name: Check actions

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test actions
        run: npm test

      - name: Rebuild bundled actions
        run: npm run build

      - name: Verify committed bundles
        run: git diff --exit-code -- setup-valdor/dist/index.js
